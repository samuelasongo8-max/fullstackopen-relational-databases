name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run official Node.js tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db?sslmode=disable
          PORT: 3001
          SECRET: test_secret

      - name: Run Jest tests
        run: npm run test:jest
        env:
          TESTING: 'true'
          NODE_ENV: 'test'
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/test_db?sslmode=disable
          PORT: 3001
          SECRET: test_secret

      - name: Print logs on failure
        if: failure()
        run: cat app.log 2>/dev/null || echo 'No log file found'
